name: Build HWMonitor

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          ls /Applications | grep Xcode || true
          sudo xcode-select -s /Applications/Xcode_26.2.app 2>/dev/null || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: |
          cd app
          xcodegen generate
          ls -la

      - name: Build (unsigned)
        run: |
          cd app
          set -o pipefail
          xcodebuild -project HWMonitor.xcodeproj \
            -scheme HWMonitor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -60

      - name: Package IPA
        run: |
          cd app
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HWMonitor.app Payload/
          zip -qry HWMonitor.ipa Payload
          ls -la HWMonitor.ipa
          unzip -t HWMonitor.ipa > /dev/null && echo "IPA CRC OK"

      - name: Run Unit Tests (simulator)
        run: |
          cd app
          set -o pipefail
          xcodebuild -project HWMonitor.xcodeproj \
            -scheme HWMonitor \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation)' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tail -80 || echo "TEST_STEP_FAILED (IPA artifact still uploaded)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hwmonitor-ipa
          path: app/HWMonitor.ipa

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwmonitor-test-logs
          path: |
            app/build/Build/Logs/**/*.xcresult
          if-no-files-found: ignore
