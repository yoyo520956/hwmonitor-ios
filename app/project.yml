name: HWMonitor
options:
  bundleIdPrefix: com.qingyao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
attributes:
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CURRENT_PROJECT_VERSION: "20261018.03"
    MARKETING_VERSION: "3.0.0"
targets:
  HWMonitor:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.hwmonitor
        PRODUCT_NAME: HWMonitor
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/Core/HWMonitor-Bridging-Header.h"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
  HWMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: HWMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.hwmonitor.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HWMonitor.app/HWMonitor"
schemes:
  HWMonitor:
    build:
      targets:
        HWMonitor: all
        HWMonitorTests: [test]
    test:
      targets:
        - HWMonitorTests
